name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            APP="banksys"
            DEPLOY_DIR="/opt/${APP}"
            PORT_MIN=8004
            PORT_MAX=8014
            CONTAINER_PORT=8501

            # 准备部署目录
            mkdir -p "${DEPLOY_DIR}"
            cd "${DEPLOY_DIR}"

            # 同步代码(从 GitHub 拉取)
            if [ -d ".git" ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/Liangbls/banksys_szai4.git .
            fi

            # 确保数据目录存在
            mkdir -p data models

            # 构建镜像
            docker build --build-arg PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple -t ${APP}:latest .

            # 查找空闲端口
            port_in_use() {
              ss -ltnH 2>/dev/null | grep -q ":$1 " && return 0
              docker ps --format "{{.Ports}}" 2>/dev/null | grep -q ":$1->" && return 0
              return 1
            }

            PORT=""
            for p in $(seq ${PORT_MIN} ${PORT_MAX}); do
              if ! port_in_use "$p"; then PORT="$p"; break; fi
            done
            [ -z "$PORT" ] && { echo "预留端口区间已全部占用,部署中止"; exit 1; }
            echo ">> 部署到主机端口 ${PORT} (容器内 ${CONTAINER_PORT})"

            # 一步停删旧容器,幂等可重跑
            docker rm -f ${APP} 2>/dev/null || true
            docker run -d --name ${APP} --restart unless-stopped \
              -p ${PORT}:${CONTAINER_PORT} \
              ${APP}:latest

            sleep 3

            # 健康检查
            curl -fsS "http://localhost:${PORT}/_stcore/health"
            echo ""
            echo ">> 部署成功: http://${{ secrets.SSH_HOST }}:${PORT}"
